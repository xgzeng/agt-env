name: Create release

# Pushing a tag v<project version> on a commit in main creates its release, then starts
# the PyPI workflow. A release made with GITHUB_TOKEN doesn't trigger other workflows,
# so pypi.yml has to be started explicitly.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write # start pypi.yml
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # needed to check the commit is in main
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Check the tag matches the project version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match project version $version" >&2
            exit 1
          fi

      - name: Check the tagged commit is in main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that isn't in main" >&2
            exit 1
          fi

      - name: Create release and start publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release published in the browser also pushes its tag, and starts pypi.yml itself.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh workflow run pypi.yml --ref "$GITHUB_REF_NAME"
          echo "Created $GITHUB_REF_NAME and started pypi.yml" >> "$GITHUB_STEP_SUMMARY"
