[project]
name = "agent-view"
version = "0.1.0"
description = "List the skills, MCP servers, and extensions available to each coding agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-view = "agent_view.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_view"]

[tool.pytest.ini_options]
testpaths = ["tests"]
